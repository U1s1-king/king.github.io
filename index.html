    <meta charset="UTF-8">

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffb6c1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <meta name="robots" content="noindex, nofollow">
    <meta name="description" content="Tomo Ebizuka 的小站：内容页与常驻播放器各自独立，切页不断音。">
    <script src="js/version.js?v=20261107"></script>
    <link rel="stylesheet" href="css/style.css?v=20261107">
    <link rel="stylesheet" href="css/sidebar.css?v=20261107">

<body>
<!-- 外壳刻意不画花瓣/粒子：两个 iframe 里的页面各自都有一份，叠起来就是双份特效。 -->

<div class="shell-stage">
    <iframe id="page-frame" title="内容页" src="about:blank"></iframe>
    <iframe id="player-frame" title="播放器" src="about:blank" allow="autoplay; encrypted-media"></iframe>
</div>

<!-- 迷你播放条：只在「不在音乐页 且 播放器里有歌」时出现，由 js/shell.js 控制 -->
<div id="app-mini-player" aria-hidden="true">
    <img class="mp-cover" id="mpCover" src="img/mortis.webp" alt="">
    <div class="mp-meta">
        <div class="mp-title" id="mpTitle">未在播放</div>
        <div class="mp-artist" id="mpArtist"></div>
    </div>
    <button class="mp-btn" id="mpPrev" type="button" aria-label="上一首"><i class="fas fa-backward-step"></i></button>
    <button class="mp-btn" id="mpPlay" type="button" aria-label="播放或暂停"><i class="fas fa-play"></i></button>
    <button class="mp-btn" id="mpNext" type="button" aria-label="下一首"><i class="fas fa-forward-step"></i></button>
</div>

    <!-- nav:bot-tab:start - 由 scripts/sync_nav.py 生成，勿手改 -->
    <nav class="bot-tab" aria-label="移动端导航">
        <a href="home.html"><i class="fas fa-cat"></i><span>首页</span></a>
        <a href="Journal.html"><i class="fas fa-book-open"></i><span>日记</span></a>

        <a href="Games.html"><i class="fas fa-gamepad"></i><span>游戏</span></a>
        <a href="TV.html"><i class="fas fa-film"></i><span>影视</span></a>
    </nav>
    <!-- nav:bot-tab:end -->

<script src="js/common.js?v=20261107"></script>
<script src="js/shell.js?v=20261107"></script>
</body>
</html>
