name: bili-sync
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 抓取 B站数据
        run: python scripts/bili_sync.py
      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bili/stats.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: 同步 B站数据 $(date -u +%Y%m%d%H)"
            git push
          else
            echo "数据无变化，跳过提交"
          fi
