name: gh-sync

# 抓取 GitHub 用户快照给首页「GitHub 开源」卡片用。
#
# 为什么不让浏览器直连 api.github.com：
#   未鉴权 60 次/小时/**出口 IP**。Cloudflare 与 GitHub Pages 的出口 IP 是共享的，
#   配额经常已被别处用光 —— 实测浏览器请求稳定 403，卡片长期显示「加载失败」。
#   在这里跑有 GITHUB_TOKEN（5000 次/小时），且是固定 IP，稳定拿得到数据。
on:
  schedule:
    - cron: '30 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 抓取 GitHub 数据
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/gh_sync.py
      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/github/stats.json
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: 同步 GitHub 数据 $(date -u +%Y%m%d%H)"
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then
              exit 0
            fi
            echo "第 $i 次推送失败，5 秒后重试…"
            sleep 5
          done
          echo "推送重试仍失败" >&2
          exit 1
