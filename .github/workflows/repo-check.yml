name: repo-check

# 守卫：_partials/ 是导航结构（侧边栏 + 底部导航）的唯一来源，各页面里那两块
# 是 scripts/sync_nav.py 生成的。谁改了 _partials/ 或页面里的生成块却忘了跑
# 脚本，这里就让流水线失败，避免重复结构再次漂移
# （music.html 的 loading="lazy" 就是这样漏掉的）。
#
# 另加 check_links.py：拦住「文件已下线、引用还留着」的死链。
# 这类漂移没有守卫时只会越积越多（README 的 Guestbook.html 就是这么漏的）。
#
# 再加 check-js-syntax.js：原来没有任何守卫覆盖 js/，于是 2026-10-12 那次
# var→const 机械改写引入的「重复声明 const」（解析期）与「自引用 const」
# （运行期 TDZ）两个错误，在 CI 全绿的情况下直接上了线。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repo-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 导航结构与 _partials/ 是否同步
        run: python scripts/sync_nav.py --check
      - name: 站内引用完整性（文件下线后引用是否残留）
        run: python scripts/check_links.py
      # 前端脚本必须先能解析。js/ 里一个解析期错误会让**整个文件**一行都不执行
      # （2026-10-12 的 music-bundle.js 就是这样，播放/解锁/搜索全挂）。
      # 自引用声明那一条抓的是运行期 TDZ，任何 parse 检查都拦不住它。
      - name: 前端脚本解析与 TDZ 检查
        run: node tools/check-js-syntax.js
      # Worker 是 ES module（严格模式），一行「赋值了但没声明」就会在运行期抛
      # ReferenceError，把整个 Worker 打成 500。2026-09-23 线上就这么挂过一次，
      # 所以把静态检查放进 CI。`new Function(src)` 查不出这类错（语法是合法的）。
      - name: Worker 未声明赋值检查
        run: node tools/check-worker.js
